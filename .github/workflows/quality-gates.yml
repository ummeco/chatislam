# Quality Gates — chatislam/web (chatislam.org)
# T-P7-Q-PERF-01 | per-PR Lighthouse + axe gate.

name: Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    # Non-blocking: the lighthouserc targets a static dist (staticDistDir:
    # ./dist), but chatislam/web is an SSR app (output: 'server', Vercel
    # adapter) with no static dist — Lighthouse needs a running server here.
    # Tracked as follow-up to rewire LHCI to build+serve the SSR app. The
    # blocking perf gate is the bundle-size job below.
    continue-on-error: true
    uses: ./.github/workflows/_reusable-lighthouse.yml
    with:
      project_path: web

  bundle-size:
    name: Bundle size check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Build with bundle analyzer (T12)
        run: ANALYZE=true pnpm build
        env:
          ANALYZE: 'true'
