# Quality Gates — chatislam/web (chatislam.org)
# T-P7-Q-PERF-01 | per-PR Lighthouse + axe gate.

name: Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    uses: ./.github/workflows/_reusable-lighthouse.yml
    with:
      project_path: web
