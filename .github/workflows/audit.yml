name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
  schedule:
    # Daily at 06:00 UTC — catches new CVE disclosures against pinned deps
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  audit:
    name: pnpm Audit (HIGH/CRITICAL gate)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Retries only on npm transport errors; advisories still fail at once.
        # See .github/scripts/pnpm-audit-gate.sh for why this is not a bare
        # `pnpm audit` call.
        run: ../.github/scripts/pnpm-audit-gate.sh --audit-level=high
