name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: pnpm audit
        # Retries only on npm transport errors; advisories still fail at once.
        # See .github/scripts/pnpm-audit-gate.sh for why this is not a bare
        # `pnpm audit` call.
        run: ../.github/scripts/pnpm-audit-gate.sh --audit-level=high

      - name: Run tests
        run: pnpm test
