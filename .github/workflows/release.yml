name: Release

# Triggered by: git tag v1.2.0 && git push origin v1.2.0
# Generates a GitHub Release with CycloneDX SBOM attached.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate CycloneDX SBOM (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-npm-buildplugin@v1
        with:
          working-directory: web

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-chatislam-${{ github.ref_name }}
          path: web/bom.xml
          retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-chatislam-${{ github.ref_name }}
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/bom.xml
