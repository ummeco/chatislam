# Security gate: ban NEXT_PUBLIC_HASURA_ADMIN_SECRET and tracked OIDC tokens (CRIT-01 / C16 / T02-P9)
name: Security — no NEXT_PUBLIC_ admin secrets or committed OIDC tokens

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-next-public-admin-secret:
    name: Grep — NEXT_PUBLIC_HASURA_ADMIN_SECRET must be zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if NEXT_PUBLIC_HASURA_ADMIN_SECRET is found in source
        run: |
          set +e
          COUNT=$(grep -rn 'NEXT_PUBLIC_HASURA_ADMIN_SECRET' \
            --include='*.ts' \
            --include='*.tsx' \
            --include='*.js' \
            --include='*.jsx' \
            --include='*.env*' \
            . | grep -v '\.github/workflows/' | wc -l)
          set -e
          echo "Occurrences found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            grep -rn 'NEXT_PUBLIC_HASURA_ADMIN_SECRET' \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              --include='*.env*' . | grep -v '\.github/workflows/'
            echo "FATAL: Use HASURA_GRAPHQL_ADMIN_SECRET (server-side only)."
            exit 1
          fi
          echo "OK — zero occurrences."

  check-vercel-oidc-token:
    name: Grep — VERCEL_OIDC_TOKEN must not be committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if VERCEL_OIDC_TOKEN value is committed in tracked files
        run: |
          # Scan for any assignment of a non-placeholder VERCEL_OIDC_TOKEN
          # (placeholder in .env.example is a comment — not a real token assignment)
          set +e
          COUNT=$(grep -rn 'VERCEL_OIDC_TOKEN=' \
            --include='*.env' \
            --include='*.env.*' \
            . | grep -v '\.github/workflows/' \
              | grep -v '# VERCEL_OIDC_TOKEN=' \
              | grep -v '.env.example' \
              | wc -l)
          set -e
          echo "Committed VERCEL_OIDC_TOKEN assignments found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            grep -rn 'VERCEL_OIDC_TOKEN=' \
              --include='*.env' --include='*.env.*' . \
              | grep -v '\.github/workflows/' \
              | grep -v '# VERCEL_OIDC_TOKEN=' \
              | grep -v '.env.example'
            echo "FATAL: VERCEL_OIDC_TOKEN must not be committed. It is auto-injected by Vercel CLI."
            exit 1
          fi
          echo "OK — VERCEL_OIDC_TOKEN not committed."

  check-anthropic-api-key:
    name: Grep — ANTHROPIC_API_KEY must not have a real value committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if real Anthropic API key is found in tracked files
        run: |
          set +e
          COUNT=$(grep -rn 'sk-ant-api[0-9]\{2\}-[A-Za-z0-9_-]\{93\}' \
            --include='*.ts' \
            --include='*.tsx' \
            --include='*.js' \
            --include='*.jsx' \
            --include='*.env' \
            --include='*.env.*' \
            . | grep -v '\.github/workflows/' \
              | grep -v '\.next/' \
              | wc -l)
          set -e
          echo "Real Anthropic API key patterns found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FATAL: Anthropic API key (sk-ant-api##-...) committed. Rotate immediately."
            exit 1
          fi
          echo "OK — no real Anthropic API key committed."
