name: Bug Report
description: Report a bug or unexpected behavior in ChatIslam
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, clear description of the bug
      placeholder: e.g. Chat history not saving between sessions
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug clearly
      placeholder: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue
      placeholder: |
        1. Go to chatislam.org
        2. Ask a question about...
        3. ...
    validations:
      required: true

  - type: input
    id: env_platform
    attributes:
      label: Platform / Device
      description: e.g. iPhone 15, Chrome on Windows, Android 14
      placeholder: e.g. Windows 11, Chrome 124
    validations:
      required: true

  - type: input
    id: env_version
    attributes:
      label: Browser version
      description: Browser name and version
      placeholder: e.g. Safari 17.4
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Attach screenshots or screen recordings if helpful (paste or drag here)
    validations:
      required: false
