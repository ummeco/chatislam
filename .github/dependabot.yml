version: 2

# Dependabot configuration — ummeco/chatislam
# T02 p9-sprint-CI-PROD-READY: monthly dependency updates, no auto-merge.
# Ecosystems: npm (web/) + github-actions.
# Auto-merge is intentionally disabled — PRs require manual review per security policy.

updates:
  # npm — web app (Next.js)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(ci)'
